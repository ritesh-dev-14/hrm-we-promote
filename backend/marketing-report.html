<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketing Report | We Promote</title>
  <meta name="description" content="Submit and view daily marketing campaign reports for your projects." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base:       #0d0f18;
      --bg-card:       #141726;
      --bg-card-hover: #1a1f35;
      --bg-input:      #1e2237;
      --border:        #2a2f4a;
      --border-focus:  #6c63ff;

      --accent:        #6c63ff;
      --accent-light:  #8b85ff;
      --accent-glow:   rgba(108,99,255,.25);
      --pink:          #f472b6;
      --teal:          #2dd4bf;
      --amber:         #fbbf24;
      --green:         #4ade80;
      --red:           #f87171;

      --text-primary:  #f1f5ff;
      --text-muted:    #8892b0;
      --text-label:    #a8b2d8;

      --radius-sm:     8px;
      --radius-md:     14px;
      --radius-lg:     20px;

      --shadow-card:   0 8px 32px rgba(0,0,0,.45);
      --shadow-glow:   0 0 40px rgba(108,99,255,.15);

      --transition:    .2s ease;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Animated background blobs ─────────────────────────────── */
    .bg-blobs {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .18;
      animation: blobFloat 8s ease-in-out infinite alternate;
    }
    .blob-1 { width: 500px; height: 500px; background: var(--accent); top: -120px; left: -150px; animation-duration: 9s; }
    .blob-2 { width: 400px; height: 400px; background: var(--pink);   bottom: -100px; right: -100px; animation-duration: 11s; animation-delay: -3s; }
    .blob-3 { width: 300px; height: 300px; background: var(--teal);   top: 50%; left: 60%; animation-duration: 13s; animation-delay: -5s; }
    @keyframes blobFloat { from { transform: translate(0,0) scale(1); } to { transform: translate(30px,20px) scale(1.08); } }

    /* ── Layout ────────────────────────────────────────────────── */
    .wrapper {
      position: relative; z-index: 1;
      max-width: 1140px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* ── Header ────────────────────────────────────────────────── */
    .page-header {
      display: flex; align-items: center; gap: 16px; margin-bottom: 40px;
    }
    .header-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--accent), var(--pink));
      border-radius: var(--radius-md);
      display: grid; place-items: center;
      font-size: 22px;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .page-header h1 {
      font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg, var(--text-primary) 60%, var(--accent-light));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .page-header p { font-size: 14px; color: var(--text-muted); margin-top: 2px; }

    /* ── Cards ─────────────────────────────────────────────────── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-card);
      transition: box-shadow var(--transition);
    }
    .card:hover { box-shadow: var(--shadow-card), var(--shadow-glow); }

    .card-title {
      font-size: 16px; font-weight: 700; color: var(--text-primary);
      display: flex; align-items: center; gap: 10px; margin-bottom: 24px;
    }
    .card-title .icon-badge {
      width: 34px; height: 34px;
      border-radius: var(--radius-sm);
      display: grid; place-items: center;
      font-size: 16px;
    }
    .badge-purple { background: rgba(108,99,255,.18); }
    .badge-teal   { background: rgba(45,212,191,.18); }
    .badge-pink   { background: rgba(244,114,182,.18); }

    /* ── Project Selector ──────────────────────────────────────── */
    .project-selector {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    }
    .project-selector label { font-size: 13px; font-weight: 600; color: var(--text-label); white-space: nowrap; }
    .styled-select {
      flex: 1; min-width: 220px;
      background: var(--bg-input); border: 1px solid var(--border);
      color: var(--text-primary); font-family: inherit; font-size: 14px;
      padding: 11px 16px; border-radius: var(--radius-sm);
      outline: none; cursor: pointer;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .styled-select:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--accent-glow); }
    .styled-select option { background: var(--bg-card); }

    /* ── Form Grid ─────────────────────────────────────────────── */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 8px;
    }
    .form-group { display: flex; flex-direction: column; gap: 7px; }
    .form-group.full { grid-column: 1 / -1; }

    .form-label {
      font-size: 12px; font-weight: 600;
      color: var(--text-label); letter-spacing: .04em; text-transform: uppercase;
    }
    .form-label .optional {
      font-size: 10px; font-weight: 400;
      color: var(--text-muted); text-transform: none; letter-spacing: 0;
      margin-left: 4px;
    }

    .form-input, .form-textarea {
      background: var(--bg-input); border: 1px solid var(--border);
      color: var(--text-primary); font-family: inherit; font-size: 14px;
      padding: 11px 14px; border-radius: var(--radius-sm);
      outline: none; transition: border-color var(--transition), box-shadow var(--transition);
    }
    .form-input:focus, .form-textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .form-input::placeholder, .form-textarea::placeholder { color: var(--text-muted); }
    .form-textarea { resize: vertical; min-height: 90px; }

    /* number inputs — hide spinners */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }

    /* ── Toggle (Yes/No) ───────────────────────────────────────── */
    .toggle-group {
      display: flex; gap: 10px;
    }
    .toggle-btn {
      flex: 1; padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      color: var(--text-muted);
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      text-align: center;
    }
    .toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
    .toggle-btn.active-yes { background: rgba(74,222,128,.12); border-color: var(--green); color: var(--green); }
    .toggle-btn.active-no  { background: rgba(248,113,113,.12); border-color: var(--red);   color: var(--red);   }

    /* ── Reason row — conditionally shown ─────────────────────── */
    #reason-row { display: none; }

    /* ── Divider ───────────────────────────────────────────────── */
    .divider {
      height: 1px; background: var(--border);
      margin: 28px 0;
    }
    .section-label {
      font-size: 11px; font-weight: 700; color: var(--accent-light);
      letter-spacing: .08em; text-transform: uppercase; margin-bottom: 16px;
    }

    /* ── Buttons ───────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 26px; border-radius: var(--radius-sm);
      font-family: inherit; font-size: 14px; font-weight: 600;
      cursor: pointer; border: none; transition: all var(--transition);
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: #fff;
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--accent-glow); }
    .btn-primary:active { transform: translateY(0); }
    .btn-outline {
      background: transparent; border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger {
      background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.3);
      color: var(--red); padding: 6px 12px; font-size: 12px;
    }
    .btn-danger:hover { background: rgba(248,113,113,.22); }
    .btn-sm { padding: 7px 14px; font-size: 12px; }

    /* loading spinner on button */
    .btn.loading { opacity: .7; pointer-events: none; }
    .btn .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Form footer ───────────────────────────────────────────── */
    .form-footer {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 12px; margin-top: 28px;
    }

    /* ── Toast ─────────────────────────────────────────────────── */
    .toast-container {
      position: fixed; bottom: 28px; right: 28px; z-index: 9999;
      display: flex; flex-direction: column; gap: 10px;
    }
    .toast {
      min-width: 280px; max-width: 380px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      display: flex; align-items: flex-start; gap: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.5);
      animation: toastIn .3s ease forwards;
    }
    .toast.hide { animation: toastOut .3s ease forwards; }
    @keyframes toastIn  { from { opacity:0; transform: translateX(40px); } to { opacity:1; transform: translateX(0); } }
    @keyframes toastOut { from { opacity:1; transform: translateX(0); } to { opacity:0; transform: translateX(40px); } }
    .toast-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
    .toast-body p:first-child { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .toast-body p:last-child  { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .toast.success .toast-icon { color: var(--green); }
    .toast.error   .toast-icon { color: var(--red);   }

    /* ── Empty state ───────────────────────────────────────────── */
    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    /* ── Reports Table ─────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; margin-top: 4px; }
    table {
      width: 100%; border-collapse: collapse; font-size: 13px;
    }
    thead tr th {
      text-align: left; padding: 12px 14px;
      font-size: 11px; font-weight: 700; color: var(--accent-light);
      text-transform: uppercase; letter-spacing: .05em;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid rgba(42,47,74,.6);
      transition: background var(--transition);
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg-card-hover); }
    tbody td {
      padding: 13px 14px;
      color: var(--text-label);
      vertical-align: middle;
      white-space: nowrap;
    }
    tbody td.wrap { white-space: normal; max-width: 180px; word-break: break-word; }
    tbody td .highlight { color: var(--text-primary); font-weight: 500; }

    /* pill badges */
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 600;
    }
    .pill-green { background: rgba(74,222,128,.12); color: var(--green); }
    .pill-red   { background: rgba(248,113,113,.12); color: var(--red); }
    .pill-gray  { background: rgba(136,146,176,.12); color: var(--text-muted); }

    /* ── Stats row ─────────────────────────────────────────────── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px 20px;
    }
    .stat-card .stat-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .stat-card .stat-value { font-size: 26px; font-weight: 800; margin-top: 4px; background: linear-gradient(135deg, var(--text-primary), var(--accent-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* ── Skeleton loader ───────────────────────────────────────── */
    .skeleton { background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%); background-size: 200%; border-radius: 6px; animation: shimmer 1.4s infinite; }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    /* ── Responsive ────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .wrapper { padding: 24px 16px 60px; }
      .page-header h1 { font-size: 22px; }
      .card { padding: 22px 18px; }
    }

    /* ── Auth overlay ──────────────────────────────────────────── */
    #auth-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: var(--bg-base);
      display: flex; align-items: center; justify-content: center;
    }
    #auth-overlay .auth-box {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 40px;
      width: 100%; max-width: 400px;
      box-shadow: var(--shadow-card);
      text-align: center;
    }
    #auth-overlay h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    #auth-overlay p  { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
    #auth-overlay .form-group { text-align: left; }
  </style>
</head>
<body>

<!-- Animated background -->
<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<!-- Auth overlay (shown if no token) -->
<div id="auth-overlay" style="display:none">
  <div class="auth-box">
    <div style="font-size:40px;margin-bottom:12px">🔒</div>
    <h2>Authentication Required</h2>
    <p>Enter your JWT token to access the Marketing Report module.</p>
    <div class="form-group" style="margin-bottom:16px">
      <label class="form-label">JWT Token</label>
      <input id="token-input" class="form-input" type="password" placeholder="Paste your token here..." />
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="saveToken()">Continue</button>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toast-container"></div>

<!-- Main page -->
<div class="wrapper" id="main-content">

  <!-- Header -->
  <div class="page-header">
    <div class="header-icon">📣</div>
    <div>
      <h1>Marketing Report</h1>
      <p>Track daily campaign performance across your projects</p>
    </div>
    <div style="margin-left:auto; display:flex; gap:10px; align-items:center;">
      <button class="btn btn-outline btn-sm" onclick="clearToken()">🔓 Logout</button>
    </div>
  </div>

  <!-- ── Project Selector Card ── -->
  <div class="card" style="margin-bottom:24px">
    <div class="card-title">
      <div class="icon-badge badge-purple">🗂️</div>
      Select Project
    </div>
    <div class="project-selector">
      <label for="project-select">Project</label>
      <select id="project-select" class="styled-select" onchange="onProjectChange()">
        <option value="">— Loading projects... —</option>
      </select>
      <button class="btn btn-outline btn-sm" onclick="loadProjects()">↻ Refresh</button>
    </div>
  </div>

  <!-- ── Submission Form Card ── -->
  <div class="card" style="margin-bottom:24px" id="form-card">
    <div class="card-title">
      <div class="icon-badge badge-pink">✍️</div>
      <span id="form-title">Submit Report</span>
    </div>

    <div class="section-label">📋 Client & Campaign Info</div>
    <div class="form-grid">

      <div class="form-group">
        <label class="form-label">Client Name <span class="optional">optional</span></label>
        <input id="f-clientName" class="form-input" type="text" placeholder="e.g. Acme Corp" />
      </div>

      <div class="form-group">
        <label class="form-label">Area Name <span class="optional">optional</span></label>
        <input id="f-areaName" class="form-input" type="text" placeholder="e.g. Mumbai, Delhi NCR" />
      </div>

      <div class="form-group full">
        <label class="form-label">Video Link <span class="optional">optional</span></label>
        <input id="f-videoLink" class="form-input" type="url" placeholder="https://youtube.com/..." />
      </div>

    </div>

    <div class="divider"></div>
    <div class="section-label">💰 Today's Performance</div>
    <div class="form-grid">

      <div class="form-group">
        <label class="form-label">Today Reach Obtained <span class="optional">optional</span></label>
        <input id="f-todayReachObtained" class="form-input" type="number" min="0" placeholder="e.g. 15000" />
      </div>

      <div class="form-group">
        <label class="form-label">Today Amount Spent (₹) <span class="optional">optional</span></label>
        <input id="f-todayAmountSpend" class="form-input" type="number" min="0" step="0.01" placeholder="e.g. 2500.00" />
      </div>

      <div class="form-group">
        <label class="form-label">Leads Obtained <span class="optional">optional</span></label>
        <input id="f-leadObtained" class="form-input" type="number" min="0" placeholder="e.g. 12" />
      </div>

      <div class="form-group">
        <label class="form-label">Type of Ads <span class="optional">optional</span></label>
        <input id="f-typeOfAds" class="form-input" type="text" placeholder="e.g. Facebook, Google, Reel" />
      </div>

    </div>

    <div class="divider"></div>
    <div class="section-label">🚦 Ad Running Status</div>
    <div class="form-grid">

      <div class="form-group">
        <label class="form-label">Add Running? <span class="optional">optional</span></label>
        <div class="toggle-group">
          <button class="toggle-btn" id="btn-yes" onclick="setAdRunning(true)">✅ Yes</button>
          <button class="toggle-btn" id="btn-no"  onclick="setAdRunning(false)">❌ No</button>
          <button class="toggle-btn" id="btn-na"  onclick="setAdRunning(null)" style="flex:0.5">— N/A</button>
        </div>
      </div>

      <div class="form-group" id="reason-row">
        <label class="form-label">Reason for Not Running Ad <span class="optional">optional</span></label>
        <textarea id="f-reasonNotRunning" class="form-textarea" placeholder="Explain why the ad is not running..."></textarea>
      </div>

    </div>

    <div class="form-footer">
      <button class="btn btn-outline" id="btn-cancel" onclick="resetForm()" style="display:none">Cancel Edit</button>
      <button class="btn btn-primary" id="btn-submit" onclick="submitReport()">
        <span>Submit Report</span>
      </button>
    </div>
  </div>

  <!-- ── Reports List ── -->
  <div id="reports-section" style="display:none">

    <!-- Stats -->
    <div class="stats-row" id="stats-row"></div>

    <!-- Table card -->
    <div class="card">
      <div class="card-title">
        <div class="icon-badge badge-teal">📊</div>
        Past Reports
        <span id="report-count" style="font-size:12px;font-weight:400;color:var(--text-muted);margin-left:auto"></span>
      </div>
      <div id="reports-list"></div>
    </div>
  </div>

</div><!-- /wrapper -->

<script>
// ─── Config ─────────────────────────────────────────────────────────────────
const API_BASE = "http://localhost:5000/api"; // ← change to your backend URL

// ─── State ──────────────────────────────────────────────────────────────────
let token = localStorage.getItem("hrm_token") || "";
let currentProjectId = null;
let editingReportId   = null;
let adRunningValue    = null; // null | true | false

// ─── Auth ────────────────────────────────────────────────────────────────────
function checkAuth() {
  if (!token) {
    document.getElementById("auth-overlay").style.display = "flex";
  } else {
    document.getElementById("auth-overlay").style.display = "none";
    loadProjects();
  }
}
function saveToken() {
  const v = document.getElementById("token-input").value.trim();
  if (!v) return showToast("error", "No token entered", "Please paste your JWT token.");
  token = v;
  localStorage.setItem("hrm_token", token);
  checkAuth();
}
function clearToken() {
  token = "";
  localStorage.removeItem("hrm_token");
  checkAuth();
}

// ─── API helper ──────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = {
    method,
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API_BASE + path, opts);
  const json = await res.json();
  if (!res.ok) throw new Error(json.message || "Request failed");
  return json;
}

// ─── Toast ───────────────────────────────────────────────────────────────────
function showToast(type, title, msg) {
  const c = document.getElementById("toast-container");
  const t = document.createElement("div");
  t.className = `toast ${type}`;
  t.innerHTML = `<div class="toast-icon">${type === "success" ? "✅" : "❌"}</div>
    <div class="toast-body"><p>${title}</p><p>${msg || ""}</p></div>`;
  c.appendChild(t);
  setTimeout(() => { t.classList.add("hide"); setTimeout(() => t.remove(), 300); }, 4000);
}

// ─── Projects ────────────────────────────────────────────────────────────────
async function loadProjects() {
  const sel = document.getElementById("project-select");
  sel.innerHTML = '<option value="">— Loading... —</option>';
  try {
    const res = await api("GET", "/projects?myProjects=true");
    const projects = res.data || res.projects || [];
    if (!projects.length) {
      sel.innerHTML = '<option value="">No projects assigned</option>';
      return;
    }
    sel.innerHTML = '<option value="">— Select a project —</option>' +
      projects.map(p => `<option value="${p.id}">${p.projectName}</option>`).join("");
  } catch (e) {
    // Fallback: try without filter
    try {
      const res2 = await api("GET", "/projects");
      const projects = res2.data || res2.projects || [];
      sel.innerHTML = '<option value="">— Select a project —</option>' +
        projects.map(p => `<option value="${p.id}">${p.projectName}</option>`).join("");
    } catch (e2) {
      sel.innerHTML = '<option value="">Failed to load projects</option>';
      showToast("error", "Load failed", e2.message);
    }
  }
}

function onProjectChange() {
  const sel = document.getElementById("project-select");
  currentProjectId = sel.value;
  resetForm();
  if (currentProjectId) {
    loadReports();
    document.getElementById("reports-section").style.display = "block";
  } else {
    document.getElementById("reports-section").style.display = "none";
  }
}

// ─── Ad Running Toggle ───────────────────────────────────────────────────────
function setAdRunning(val) {
  adRunningValue = val;
  document.getElementById("btn-yes").className = "toggle-btn" + (val === true  ? " active-yes" : "");
  document.getElementById("btn-no").className  = "toggle-btn" + (val === false ? " active-no"  : "");
  document.getElementById("btn-na").className  = "toggle-btn" + (val === null  ? " active-yes" : "");
  document.getElementById("reason-row").style.display = val === false ? "flex" : "none";
  document.getElementById("reason-row").style.flexDirection = "column";
}

// ─── Form helpers ─────────────────────────────────────────────────────────────
function getFormData() {
  return {
    projectId:          currentProjectId,
    clientName:         document.getElementById("f-clientName").value.trim()         || null,
    videoLink:          document.getElementById("f-videoLink").value.trim()           || null,
    areaName:           document.getElementById("f-areaName").value.trim()            || null,
    isAdRunning:        adRunningValue,
    todayReachObtained: document.getElementById("f-todayReachObtained").value !== "" ? Number(document.getElementById("f-todayReachObtained").value) : null,
    todayAmountSpend:   document.getElementById("f-todayAmountSpend").value   !== "" ? Number(document.getElementById("f-todayAmountSpend").value)   : null,
    reasonNotRunning:   document.getElementById("f-reasonNotRunning").value.trim()    || null,
    typeOfAds:          document.getElementById("f-typeOfAds").value.trim()           || null,
    leadObtained:       document.getElementById("f-leadObtained").value       !== "" ? Number(document.getElementById("f-leadObtained").value)       : null,
  };
}

function fillForm(r) {
  document.getElementById("f-clientName").value         = r.clientName         || "";
  document.getElementById("f-videoLink").value          = r.videoLink          || "";
  document.getElementById("f-areaName").value           = r.areaName           || "";
  document.getElementById("f-todayReachObtained").value = r.todayReachObtained ?? "";
  document.getElementById("f-todayAmountSpend").value   = r.todayAmountSpend   ?? "";
  document.getElementById("f-reasonNotRunning").value   = r.reasonNotRunning   || "";
  document.getElementById("f-typeOfAds").value          = r.typeOfAds          || "";
  document.getElementById("f-leadObtained").value       = r.leadObtained       ?? "";
  setAdRunning(r.isAdRunning === null || r.isAdRunning === undefined ? null : r.isAdRunning);
}

function resetForm() {
  editingReportId = null;
  adRunningValue  = null;
  document.getElementById("form-title").textContent = "Submit Report";
  document.getElementById("btn-submit").innerHTML   = "<span>Submit Report</span>";
  document.getElementById("btn-cancel").style.display = "none";
  document.querySelectorAll(".form-input, .form-textarea").forEach(el => el.value = "");
  setAdRunning(null);
  document.getElementById("btn-na").className = "toggle-btn";
}

// ─── Submit / Update ─────────────────────────────────────────────────────────
async function submitReport() {
  if (!currentProjectId) return showToast("error", "No project selected", "Please select a project first.");
  const btn = document.getElementById("btn-submit");
  btn.classList.add("loading");
  btn.innerHTML = `<div class="spinner"></div> ${editingReportId ? "Updating..." : "Submitting..."}`;

  try {
    const data = getFormData();
    if (editingReportId) {
      await api("PATCH", `/marketing-reports/${editingReportId}`, data);
      showToast("success", "Report updated", "Your marketing report has been updated.");
    } else {
      await api("POST", "/marketing-reports", data);
      showToast("success", "Report submitted", "Your marketing report has been saved.");
    }
    resetForm();
    await loadReports();
  } catch (e) {
    showToast("error", "Submission failed", e.message);
  } finally {
    btn.classList.remove("loading");
    btn.innerHTML = `<span>${editingReportId ? "Update Report" : "Submit Report"}</span>`;
  }
}

// ─── Edit ─────────────────────────────────────────────────────────────────────
function startEdit(report) {
  editingReportId = report.id;
  fillForm(report);
  document.getElementById("form-title").textContent    = "Edit Report";
  document.getElementById("btn-submit").innerHTML      = "<span>Update Report</span>";
  document.getElementById("btn-cancel").style.display  = "inline-flex";
  document.getElementById("form-card").scrollIntoView({ behavior: "smooth", block: "start" });
}

// ─── Delete ───────────────────────────────────────────────────────────────────
async function deleteReport(id) {
  if (!confirm("Delete this marketing report? This cannot be undone.")) return;
  try {
    await api("DELETE", `/marketing-reports/${id}`);
    showToast("success", "Deleted", "Marketing report removed.");
    await loadReports();
  } catch (e) {
    showToast("error", "Delete failed", e.message);
  }
}

// ─── Load & render reports ───────────────────────────────────────────────────
async function loadReports() {
  if (!currentProjectId) return;
  const el = document.getElementById("reports-list");
  el.innerHTML = `<div style="padding:30px 0;text-align:center"><div class="skeleton" style="height:18px;width:60%;margin:0 auto 12px"></div><div class="skeleton" style="height:18px;width:45%;margin:0 auto"></div></div>`;

  try {
    const res = await api("GET", `/marketing-reports?projectId=${currentProjectId}`);
    const reports = res.data || [];

    renderStats(reports);

    document.getElementById("report-count").textContent = `${reports.length} record${reports.length !== 1 ? "s" : ""}`;

    if (!reports.length) {
      el.innerHTML = `<div class="empty-state"><div class="emoji">📋</div><p>No reports yet for this project.<br/>Fill the form above to add the first one.</p></div>`;
      return;
    }

    el.innerHTML = `<div class="table-wrap"><table>
      <thead><tr>
        <th>Date</th>
        <th>Client</th>
        <th>Area</th>
        <th>Ad Running</th>
        <th>Reach</th>
        <th>Spent (₹)</th>
        <th>Leads</th>
        <th>Type of Ads</th>
        <th>Video</th>
        <th>Actions</th>
      </tr></thead>
      <tbody>${reports.map(renderRow).join("")}</tbody>
    </table></div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty-state"><div class="emoji">⚠️</div><p>${e.message}</p></div>`;
  }
}

function renderRow(r) {
  const date       = r.date ? new Date(r.date).toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"numeric" }) : "—";
  const adPill     = r.isAdRunning === true ? '<span class="pill pill-green">● Yes</span>' : r.isAdRunning === false ? '<span class="pill pill-red">● No</span>' : '<span class="pill pill-gray">N/A</span>';
  const videoLink  = r.videoLink ? `<a href="${r.videoLink}" target="_blank" style="color:var(--accent-light);text-decoration:none">🔗 View</a>` : "—";
  // Roles: ADMIN/HR/EA can delete, MANAGER can edit
  const actions = `
    <div style="display:flex;gap:6px">
      <button class="btn btn-outline btn-sm" onclick='startEdit(${JSON.stringify(r)})' title="Edit">✏️</button>
      <button class="btn btn-danger" onclick="deleteReport('${r.id}')" title="Delete">🗑️</button>
    </div>`;
  return `<tr>
    <td class="highlight">${date}</td>
    <td class="wrap">${r.clientName || '<span style="color:var(--text-muted)">—</span>'}</td>
    <td>${r.areaName || '<span style="color:var(--text-muted)">—</span>'}</td>
    <td>${adPill}</td>
    <td class="highlight">${r.todayReachObtained != null ? r.todayReachObtained.toLocaleString() : "—"}</td>
    <td class="highlight">${r.todayAmountSpend  != null ? "₹" + Number(r.todayAmountSpend).toLocaleString("en-IN") : "—"}</td>
    <td class="highlight">${r.leadObtained      != null ? r.leadObtained : "—"}</td>
    <td>${r.typeOfAds || '<span style="color:var(--text-muted)">—</span>'}</td>
    <td>${videoLink}</td>
    <td>${actions}</td>
  </tr>`;
}

function renderStats(reports) {
  const totalReach  = reports.reduce((s, r) => s + (r.todayReachObtained || 0), 0);
  const totalSpend  = reports.reduce((s, r) => s + (r.todayAmountSpend   || 0), 0);
  const totalLeads  = reports.reduce((s, r) => s + (r.leadObtained       || 0), 0);
  const adsRunning  = reports.filter(r => r.isAdRunning === true).length;

  document.getElementById("stats-row").innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Total Reports</div>
      <div class="stat-value">${reports.length}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Reach</div>
      <div class="stat-value">${totalReach >= 1000 ? (totalReach/1000).toFixed(1)+"K" : totalReach}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Spent</div>
      <div class="stat-value">₹${totalSpend >= 1000 ? (totalSpend/1000).toFixed(1)+"K" : totalSpend.toFixed(0)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Leads</div>
      <div class="stat-value">${totalLeads}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Days Ad Ran</div>
      <div class="stat-value">${adsRunning}</div>
    </div>`;
}

// ─── Init ─────────────────────────────────────────────────────────────────────
checkAuth();
</script>
</body>
</html>
